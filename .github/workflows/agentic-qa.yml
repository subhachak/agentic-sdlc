name: Agentic QA Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]
    # Only the execution plane and the app under test can change what this
    # pipeline should assert. Control-plane edits do not trigger a QA run.
    paths:
      - "demo-app/**"
      - "execution-plane/**"

  # Dispatched by the control plane's WorkDispatch port. The correlation id
  # is echoed into run-name because workflow_dispatch returns no run id, and
  # matching on it is the only way to tie a trigger call to the run it made.
  workflow_dispatch:
    inputs:
      control_run_id:
        description: "Control-plane run id"
        required: true
      correlation_id:
        description: "Nonce used to correlate this run back to the dispatch"
        required: true
      base_sha:
        description: "Commit to diff from"
        required: true
      head_sha:
        description: "Commit to diff to"
        required: true

run-name: >-
  Agentic QA
  ${{ github.event_name == 'workflow_dispatch'
      && format('· dispatch {0}', inputs.correlation_id)
      || format('· PR #{0}', github.event.pull_request.number) }}

# Two merges in quick succession would otherwise race on the data store and
# both post to the same PR.
concurrency:
  group: agentic-qa-${{ github.event.pull_request.number || inputs.control_run_id }}
  cancel-in-progress: false

jobs:
  # Executes agent-generated Playwright specs, so it deliberately holds no
  # write token. The worst a malicious diff can achieve here is a failed run.
  qa-run:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # The revision under test, not the revision the workflow lives on. On a
      # dispatch there is no pull request, so `github.sha` resolved to the
      # default branch — the run tested the code that was already there and
      # reported a verdict on a change it never saw.
      - name: Checkout the revision under test
        uses: actions/checkout@v4
        with:
          ref: >-
            ${{ inputs.head_sha
                || github.event.pull_request.merge_commit_sha
                || github.sha }}
          fetch-depth: 0

      # `workflow_dispatch` cannot decline a run for a missing input, so the
      # check happens here. Failing loudly beats testing the wrong commit.
      - name: Refuse a dispatch with no revision
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "${{ inputs.head_sha }}" ]; then
            echo "::error::dispatched with no head_sha — refusing to test an" \
                 "arbitrary revision. The control plane populates this from" \
                 "the commit the implementation phase opened."
            exit 1
          fi

      # The two triggers expose different event payloads. Resolve them once
      # here so no later step needs a conditional.
      - name: Resolve run inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BASE_SHA=${{ inputs.base_sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ inputs.head_sha }}" >> "$GITHUB_ENV"
            echo "PR_NUMBER=0" >> "$GITHUB_ENV"
            echo "LABEL=${{ inputs.correlation_id }}" >> "$GITHUB_ENV"
          else
            echo "BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "HEAD_SHA=${{ github.event.pull_request.merge_commit_sha }}" >> "$GITHUB_ENV"
            echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
            echo "LABEL=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: pip install -r execution-plane/qa/orchestrator/requirements-dev.txt

      - name: Test the orchestrator's deterministic gates
        working-directory: execution-plane/qa
        run: python -m pytest tests/ -q

      - name: Install the app under test
        working-directory: demo-app
        run: npm ci

      - name: Build the app under test
        working-directory: demo-app
        run: npm run build

      - name: Install Playwright browsers
        working-directory: demo-app
        run: npx playwright install --with-deps chromium

      - name: Run agentic QA pipeline
        working-directory: execution-plane/qa
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m orchestrator.run \
            --phase run \
            --state-file qa-state.json \
            --repo "${{ github.repository }}" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA"

      - name: Upload pipeline state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-state-${{ env.LABEL }}
          path: execution-plane/qa/qa-state.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ env.LABEL }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 30

  # Holds the write token. Runs no npm install, no build, no Playwright, and
  # none of the generated specs — it only reads the state file and posts.
  # Only meaningful for a merged PR. A dispatched run reports back through
  # the control plane instead, which polls for the state artifact.
  qa-report:
    needs: qa-run
    if: always() && github.event_name == 'pull_request' && needs.qa-run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: pip install -r execution-plane/qa/orchestrator/requirements.txt

      - name: Download pipeline state
        uses: actions/download-artifact@v4
        with:
          name: qa-state-pr-${{ github.event.pull_request.number }}

      - name: Post results to the PR
        working-directory: execution-plane/qa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m orchestrator.run \
            --phase report \
            --state-file ../../qa-state.json \
            --repo "${{ github.repository }}" \
            --pr-number "${{ github.event.pull_request.number }}"
