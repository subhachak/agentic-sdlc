name: Control Plane

on:
  push:
    branches: [main]
    paths: ["control-plane/**", ".github/workflows/control-plane.yml"]
  pull_request:
    paths: ["control-plane/**", ".github/workflows/control-plane.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install
        working-directory: control-plane/api
        run: uv sync --all-groups

      # Includes test_architecture_purity.py, which asserts in a clean
      # subprocess that only the Claude adapter may import `anthropic`.
      - name: Test
        working-directory: control-plane/api
        run: uv run pytest -q
