<text x="1292.2" y="1161.0" text-anchor="middle" font-size="11" fill="#6f827c">have run and passed</text>
<text x="1070.0" y="1323.4" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Coverage &amp; evidence</text>
<text x="1070.0" y="1336.4" text-anchor="middle" font-size="11" fill="#6f827c">a criterion is verified only</text>
<text x="1070.0" y="1347.4" text-anchor="middle" font-size="11" fill="#6f827c">by an observed run</text>
