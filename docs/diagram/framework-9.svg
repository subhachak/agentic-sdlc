<text x="900.0" y="564.0" text-anchor="middle" font-size="24" font-weight="700" fill="#0e6f62">Impact Engine</text>
<text x="900.0" y="577.0" text-anchor="middle" font-size="13" fill="#6f827c">one assessment: paths, confidence,</text>
<text x="900.0" y="588.0" text-anchor="middle" font-size="13" fill="#6f827c">test obligations, blind spots</text>
<text x="1116.0" y="642.6" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Design review</text>
<text x="1116.0" y="655.6" text-anchor="middle" font-size="13" fill="#6f827c">a change may touch only</text>
<text x="1116.0" y="666.6" text-anchor="middle" font-size="13" fill="#6f827c">what the design named</text>
<text x="1230.9" y="841.7" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Change review</text>
<text x="1230.9" y="854.7" text-anchor="middle" font-size="13" fill="#6f827c">what the agent actually did,</text>
<text x="1230.9" y="865.7" text-anchor="middle" font-size="13" fill="#6f827c">checked against it</text>
<text x="1191.0" y="1068.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Release gate</text>
<text x="1191.0" y="1081.0" text-anchor="middle" font-size="13" fill="#6f827c">required regressions must</text>
<text x="1191.0" y="1092.0" text-anchor="middle" font-size="13" fill="#6f827c">have run and passed</text>
<text x="1014.9" y="1215.7" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Coverage &amp; evidence</text>
<text x="1014.9" y="1228.7" text-anchor="middle" font-size="13" fill="#6f827c">a criterion is verified only</text>
<text x="1014.9" y="1239.7" text-anchor="middle" font-size="13" fill="#6f827c">by an observed run</text>
<text x="785.1" y="1215.7" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Coherence checks</text>
<text x="785.1" y="1228.7" text-anchor="middle" font-size="13" fill="#6f827c">configurations that build</text>
<text x="785.1" y="1239.7" text-anchor="middle" font-size="13" fill="#6f827c">and cannot work</text>
<text x="609.0" y="1068.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Snapshot &amp; export</text>
<text x="609.0" y="1081.0" text-anchor="middle" font-size="13" fill="#6f827c">the versioned projection the</text>
<text x="609.0" y="1092.0" text-anchor="middle" font-size="13" fill="#6f827c">execution plane reads</text>
<text x="569.1" y="841.7" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Reconciler</text>
<text x="569.1" y="854.7" text-anchor="middle" font-size="13" fill="#6f827c">pulls results for work</text>
<text x="569.1" y="865.7" text-anchor="middle" font-size="13" fill="#6f827c">running elsewhere</text>
<text x="684.0" y="642.6" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Audit trail</text>
<text x="684.0" y="655.6" text-anchor="middle" font-size="13" fill="#6f827c">every decision,</text>
<text x="684.0" y="666.6" text-anchor="middle" font-size="13" fill="#6f827c">with its inputs</text>
<circle cx="900.0" cy="900.0" r="200" fill="#dceae7" stroke="#0e6f62" stroke-width="2"/>
<text x="900.0" y="805.0" text-anchor="middle" font-size="28" font-weight="700" fill="#0e6f62">Context Graph &amp; Ontology</text>
<text x="900.0" y="835.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Ontology</text>
<text x="900.0" y="849.0" text-anchor="middle" font-size="14" fill="#41544e">15 node types · 18 edge types · validated signatures</text>
<text x="900.0" y="869.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Identity</text>
<text x="900.0" y="883.0" text-anchor="middle" font-size="14" fill="#41544e">uuid5(type | system | external_id)</text>
<text x="900.0" y="903.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Scope</text>
<text x="900.0" y="917.0" text-anchor="middle" font-size="14" fill="#41544e">every read and write names its project</text>
<text x="900.0" y="937.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Provenance</text>
<text x="900.0" y="951.0" text-anchor="middle" font-size="14" fill="#41544e">every assertion carries how it was derived</text>
<text x="900.0" y="971.0" text-anchor="middle" font-size="22" font-weight="600" fill="#12211d">Truth classes</text>
<text x="900.0" y="985.0" text-anchor="middle" font-size="14" fill="#41544e">authoritative · derived · observed · inferred</text>
<text x="900.0" y="1013.0" text-anchor="middle" font-size="14" font-style="italic" fill="#0e6f62">an LLM inference must never be</text>
<text x="900.0" y="1029.0" text-anchor="middle" font-size="14" font-style="italic" fill="#0e6f62">indistinguishable from a compiler-derived fact</text>
