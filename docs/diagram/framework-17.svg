<text x="900.0" y="488.0" text-anchor="middle" font-size="17" font-weight="700" fill="#0e6f62">Impact Engine</text>
<text x="900.0" y="501.0" text-anchor="middle" font-size="11" fill="#6f827c">one assessment: paths, confidence,</text>
<text x="900.0" y="512.0" text-anchor="middle" font-size="11" fill="#6f827c">test obligations, blind spots</text>
<text x="1164.8" y="584.4" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Design review</text>
<text x="1164.8" y="597.4" text-anchor="middle" font-size="11" fill="#6f827c">a change may touch only</text>
<text x="1164.8" y="608.4" text-anchor="middle" font-size="11" fill="#6f827c">what the design named</text>
<text x="1305.7" y="828.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Change review</text>
