<text x="900.0" y="949.5" text-anchor="middle" font-size="12" fill="#41544e">every assertion carries how it was derived</text>
<text x="900.0" y="969.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Truth classes</text>
<text x="900.0" y="983.5" text-anchor="middle" font-size="12" fill="#41544e">authoritative · derived · observed · inferred</text>
<text x="900.0" y="1011.5" text-anchor="middle" font-size="12" font-style="italic" fill="#0e6f62">an LLM inference must never be</text>
<text x="900.0" y="1025.5" text-anchor="middle" font-size="12" font-style="italic" fill="#0e6f62">indistinguishable from a compiler-derived fact</text>
