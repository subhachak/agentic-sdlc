<text x="1305.7" y="852.5" text-anchor="middle" font-size="11" fill="#6f827c">checked against it</text>
<text x="1256.8" y="1106.0" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Release gate</text>
<text x="1256.8" y="1119.0" text-anchor="middle" font-size="11" fill="#6f827c">required regressions must</text>
<text x="1256.8" y="1130.0" text-anchor="middle" font-size="11" fill="#6f827c">have run and passed</text>
<text x="1040.9" y="1287.2" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Coverage &amp; evidence</text>
<text x="1040.9" y="1300.2" text-anchor="middle" font-size="11" fill="#6f827c">a criterion is verified only</text>
<text x="1040.9" y="1311.2" text-anchor="middle" font-size="11" fill="#6f827c">by an observed run</text>
<text x="759.1" y="1287.2" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Coherence checks</text>
<text x="759.1" y="1300.2" text-anchor="middle" font-size="11" fill="#6f827c">configurations that build</text>
<text x="759.1" y="1311.2" text-anchor="middle" font-size="11" fill="#6f827c">and cannot work</text>
<text x="543.2" y="1106.0" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Snapshot &amp; export</text>
<text x="543.2" y="1119.0" text-anchor="middle" font-size="11" fill="#6f827c">the versioned projection the</text>
<text x="543.2" y="1130.0" text-anchor="middle" font-size="11" fill="#6f827c">execution plane reads</text>
<text x="494.3" y="828.5" text-anchor="middle" font-size="15" font-weight="600" fill="#12211d">Reconciler</text>
<text x="494.3" y="841.5" text-anchor="middle" font-size="11" fill="#6f827c">pulls results for work</text>
<text x="494.3" y="852.5" text-anchor="middle" font-size="11" fill="#6f827c">running elsewhere</text>
