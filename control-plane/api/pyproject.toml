[project]
name = "agentic-sdlc-api"
version = "0.1.0"
description = "Scaffolding-phase agentic SDLC pipeline accelerator — FastAPI + LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "anthropic>=0.40",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "anyio>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
