# Stand-in for Requirements Refinement Agent output.
#
# Acceptance criteria carry stable ids. That is what turns a scenario's
# `ac_ref` from a free-text note into a VERIFIED_BY edge in the context
# graph, and what lets the testability gate reject a scenario that claims to
# cover a criterion which does not exist.
features:
  - id: claims-list
    route: /claims
    component: claims-table
    description: Policyholder-facing table listing all claims with id, policyholder, status, and last updated date.
    acceptance_criteria:
      - id: claims-list/ac-1
        text: Table renders one row per claim in the data store
      - id: claims-list/ac-2
        text: Each row shows id, policyholder, status, last updated date
  - id: claims-status-filter
    route: /claims
    component: claims-filter
    description: A status filter dropdown lets the user narrow the claims table to one status (Under Review, Approved, Denied) or view all.
    acceptance_criteria:
      - id: claims-status-filter/ac-1
        text: Filter dropdown defaults to "All" and shows every claim
      - id: claims-status-filter/ac-2
        text: Selecting a status shows only rows matching that status
      - id: claims-status-filter/ac-3
        text: Selecting a status with zero matching claims shows an empty-state message instead of an empty table

# The UI contract the generation agent writes against, per route.
#
# Every failure in the first real run that was not a data problem came from
# this being implicit. The agent was handed a flat list of test ids with no
# page and no values, so it looked for the home page's nav link on /claims,
# and it guessed that "no filter" was the empty string when the option is
# literally "All" — a guess Playwright spends thirty seconds discovering.
ui:
  "/":
    - testid: nav-claims
      note: link through to the claims page
  "/claims":
    - testid: claims-table
      note: >-
        the table element. Whether it should remain in the DOM when nothing
        matches is governed by claims-status-filter/ac-3, not by this note —
        assert what the criterion requires, not what the app currently does.
    - testid: claim-row
      note: one per claim, carrying a data-status attribute with the claim status
    - testid: status-filter
      note: >-
        a <select>. Its option values are exactly "All", "Under Review",
        "Approved" and "Denied". "All" is the unfiltered option — there is no
        empty-string option, and selecting one that does not exist hangs until
        the test times out.
    - testid: empty-state
      note: replaces the rows when no claim matches the selected status

# The API contract, for the same reason as the UI one. The generator is told
# to derive expected counts from this endpoint, and with nothing describing
# its shape it guessed a bare array — so every assertion about the body failed
# on a response that was perfectly correct.
api:
  - endpoint: GET /api/claims
    note: >-
      Returns an object, never a bare array: {"claims": [ ... ]}. Each claim
      has id, policyholder, status and lastUpdated. The optional ?status=
      parameter filters case-insensitively; a status matching nothing returns
      {"claims": []} with HTTP 200, not an error, and an omitted or empty
      parameter returns every claim.
    testing: >-
      Scenarios needing a state the shared data cannot produce — no claims at
      all, or a status with zero matches — must intercept this endpoint with
      page.route and serve their own body rather than relying on the data
      store. The store is shared by every test in the run: seeding it for one
      scenario breaks another, and interception gives a scenario its own data
      without touching anyone else's.
